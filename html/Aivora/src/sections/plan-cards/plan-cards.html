<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plan Cards</title>
  
</head>
<body>
  <section class="pcd">
    <div class="pcd-grid">
      <div class="pcd-card"><div class="pcd-name">Starter</div><div class="pcd-price">$0<small>/mo</small></div><ul class="pcd-feat"><li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5L20 7"/></svg>3 projects</li><li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5L20 7"/></svg>Community support</li><li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5L20 7"/></svg>1 GB storage</li></ul><span class="pcd-cta">Start free</span></div>
      <div class="pcd-card pcd-pop"><div class="pcd-name">Pro<span class="pcd-badge">Popular</span></div><div class="pcd-price">$29<small>/mo</small></div><ul class="pcd-feat"><li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5L20 7"/></svg>Unlimited projects</li><li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5L20 7"/></svg>Advanced analytics</li><li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5L20 7"/></svg>Priority support</li><li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5L20 7"/></svg>100 GB storage</li></ul><span class="pcd-cta">Get Pro</span></div>
      <div class="pcd-card"><div class="pcd-name">Team</div><div class="pcd-price">$99<small>/mo</small></div><ul class="pcd-feat"><li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5L20 7"/></svg>Everything in Pro</li><li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5L20 7"/></svg>SSO &amp; audit logs</li><li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5L20 7"/></svg>Unlimited storage</li></ul><span class="pcd-cta">Choose Team</span></div>
    </div>
  </section>
</body>
</html>
